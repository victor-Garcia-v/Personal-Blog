<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="55%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g>
    <rect x="0" y="250" width="1600" height="90" fill="url(#beam)"/>
    <rect x="0" y="430" width="1600" height="40" fill="url(#beam)" opacity="0.7"/>
    <rect x="0" y="600" width="1600" height="140" fill="url(#beam)" opacity="0.5"/>
  </g>
  <circle cx="1250" cy="230" r="160" fill="#4facfe" opacity="0.12"/>
  <circle cx="1250" cy="230" r="90" fill="#4facfe" opacity="0.10"/>
</svg>
